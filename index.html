<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletânea de Louvores - ICR Florianópolis</title>
  <link rel="icon" type="image/png" href="icr_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button class="projector-exit-btn" onclick="alternarModoProjetor()">Sair do Modo Projetor</button>

  <header class="site-header">
    <div class="brand-section">
      <button class="toggle-sidebar-btn" id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Alternar Menu">
        Menu
      </button>
      <a href="#" class="brand-logo-link" onclick="location.reload(); return false;">
        <img 
          src="icr_logo_sem_fundo.png" 
          onerror="this.onerror=null; this.src='icr_logo_maior.png';" 
          alt="Logo ICR Florianópolis" 
          class="brand-logo"
        >
        <div class="brand-text-block">
          <span class="brand-title">Coletânea de Louvores</span>
          <span class="brand-subtitle">ICR Florianópolis</span>
        </div>
      </a>
    </div>

    <div class="header-right">
      <span class="repertoire-badge" id="totalCounter">0 hinos</span>
    </div>
  </header>

  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-top-row">
          <span class="sidebar-title">Repertório</span>
          <button class="sort-btn" id="sortBtn" onclick="alternarOrdenacao()" title="Alternar Ordenação">
            Ordem: Nº
          </button>
        </div>

        <div class="sidebar-search-box">
          <input 
            type="text" 
            id="searchInput" 
            class="sidebar-search-input" 
            placeholder="Buscar hino por número ou título..." 
            oninput="filtrarHinos()" 
            autocomplete="off"
          >
          <button class="search-clear-btn" id="searchClearBtn" onclick="limparBusca()" title="Limpar busca">&times;</button>
        </div>
      </div>

      <div class="song-list-container">
        <ul class="song-list" id="listaHinos"></ul>
        <div id="noResults" class="no-results" style="display: none;">
          Nenhum hino encontrado.
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div id="conteudoHino">
        <div class="empty-state">
          <h2>Coletânea ICR Florianópolis</h2>
          <p>Selecione um louvor no menu lateral para visualizar a letra e cifras.</p>
        </div>
      </div>
    </main>

  </div>

  <script>
    let hinosData = [];
    let hinoAtualId = null;
    let ordemAlfabetica = false;
    let exibirCifras = true;
    let tamanhoFontePercent = 100;
    let autoscrollAtivo = false;
    let autoscrollTimer = null;
    let autoscrollVelocidade = 1;

    async function carregarHinos() {
      try {
        const res = await fetch('/api/hinos');
        if (!res.ok) throw new Error('Erro ao carregar hinos');
        hinosData = await res.json();
        
        atualizarContador();
        renderizarLista();

        if (hinosData.length > 0) {
          const hashId = parseInt(window.location.hash.replace('#', ''));
          const itemInicial = hinosData.find(h => h.id === hashId) || hinosData[0];
          exibirHino(itemInicial.id);
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    function atualizarContador() {
      const el = document.getElementById('totalCounter');
      el.textContent = `${hinosData.length} ${hinosData.length === 1 ? 'louvor' : 'louvores'}`;
    }

    function renderizarLista() {
      const termo = document.getElementById('searchInput').value.trim().toLowerCase();
      const listaEl = document.getElementById('listaHinos');
      const noResultsEl = document.getElementById('noResults');

      let filtrados = hinosData.filter(hino => {
        const numStr = String(hino.id);
        const numPad = String(hino.id).padStart(2, '0');
        const tituloLower = hino.titulo.toLowerCase();
        return tituloLower.includes(termo) || numStr === termo || numPad === termo;
      });

      if (ordemAlfabetica) {
        filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
      } else {
        filtrados.sort((a, b) => a.id - b.id);
      }

      listaEl.innerHTML = '';

      if (filtrados.length === 0) {
        noResultsEl.style.display = 'block';
        return;
      } else {
        noResultsEl.style.display = 'none';
      }

      filtrados.forEach(hino => {
        const numFormatado = String(hino.id).padStart(2, '0');
        const isSelected = hino.id === hinoAtualId;

        const li = document.createElement('li');
        li.className = `song-item ${isSelected ? 'active' : ''}`;
        li.innerHTML = `
          <a href="#${hino.id}" class="song-link" onclick="selecionarHino(${hino.id}); return false;">
            <span class="song-number">${numFormatado}</span>
            <span class="song-title-text">${escaparHTML(hino.titulo)}</span>
            ${hino.observacao ? `<span class="song-obs-badge">Ensaiar</span>` : ''}
          </a>
        `;
        listaEl.appendChild(li);
      });
    }

    function selecionarHino(id) {
      hinoAtualId = id;
      window.location.hash = id;
      renderizarLista();
      exibirHino(id);

      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
      }
    }

    function exibirHino(id) {
      const hino = hinosData.find(h => h.id === id);
      if (!hino) return;

      hinoAtualId = id;
      const numFormatado = String(hino.id).padStart(2, '0');

      const container = document.getElementById('conteudoHino');
      container.innerHTML = `
        <article class="hino-card">
          <header class="hino-header">
            <div class="hino-meta-top">
              <span class="hino-num-tag">#${numFormatado}</span>
              ${hino.tom ? `<span class="hino-tom-badge">Tom: ${escaparHTML(hino.tom)}</span>` : ''}
            </div>
            <h1 class="hino-title">${escaparHTML(hino.titulo)}</h1>
            ${hino.observacao ? `
              <div class="observacao-bar">
                <span>Observação: ${escaparHTML(hino.observacao)}</span>
              </div>
            ` : ''}
          </header>

          <div class="cifra-toolbar">
            <div class="toolbar-group">
              <button class="btn-tool" onclick="alterarTamanhoFonte(-10)" title="Diminuir fonte">A-</button>
              <span class="font-size-indicator" id="fontSizeLabel">${tamanhoFontePercent}%</span>
              <button class="btn-tool" onclick="alterarTamanhoFonte(10)" title="Aumentar fonte">A+</button>
              <button class="btn-tool" onclick="resetarTamanhoFonte()" title="Tamanho padrão">Reset</button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="btn-tool ${exibirCifras ? 'active' : ''}" id="btnToggleCifras" onclick="alternarExibicaoCifras()">
                ${exibirCifras ? 'Cifras: ON' : 'Somente Letra'}
              </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="btn-tool ${autoscrollAtivo ? 'active' : ''}" id="btnAutoScroll" onclick="alternarAutoScroll()">
                ${autoscrollAtivo ? 'Rolagem: ON' : 'Auto-scroll'}
              </button>
              <select class="speed-select" id="speedSelect" onchange="mudarVelocidadeAutoScroll(this.value)" title="Velocidade de rolagem">
                <option value="1" ${autoscrollVelocidade == 1 ? 'selected' : ''}>1x</option>
                <option value="1.5" ${autoscrollVelocidade == 1.5 ? 'selected' : ''}>1.5x</option>
                <option value="2" ${autoscrollVelocidade == 2 ? 'selected' : ''}>2x</option>
              </select>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="btn-tool" onclick="alternarModoProjetor()" title="Modo de Leitura / Projetor">
                Modo Projetor
              </button>
              <button class="btn-tool" onclick="copiarLetra()" title="Copiar letra">
                Copiar
              </button>
            </div>
          </div>

          <div class="lyric-container">
            <pre class="lyric-content" id="lyricContent" style="font-size: calc(1.05rem * ${tamanhoFontePercent / 100});">${formatarLetraECifra(hino.letra)}</pre>
          </div>
        </article>
      `;

      renderizarLista();
    }

    function formatarLetraECifra(texto) {
      if (!texto) return '';

      const linhas = texto.split('\n');
      let resultadoHtml = [];

      for (let i = 0; i < linhas.length; i++) {
        let linha = linhas[i];

        if (linha.startsWith('[Tom:')) {
          continue;
        }

        if (/^\s*\[.+\]\s*$/.test(linha)) {
          const nomeSecao = linha.replace(/\[|\]/g, '').trim();
          resultadoHtml.push(`<span class="song-section-header">${escaparHTML(nomeSecao)}</span>`);
          continue;
        }

        if (!exibirCifras) {
          if (ehLinhaDeCifra(linha)) {
            continue;
          }
        }

        if (ehLinhaDeCifra(linha)) {
          resultadoHtml.push(`<span class="chord-line">${destacarAcordesNaLinha(linha)}</span>`);
        } else {
          resultadoHtml.push(escaparHTML(linha));
        }
      }

      return resultadoHtml.join('\n');
    }

    function ehLinhaDeCifra(linha) {
      if (!linha || linha.trim().length === 0) return false;
      const palavras = linha.trim().split(/\s+/);
      const padraoCifra = /^[A-G]([#b])?(m|maj|min|dim|aug|sus[24]?)?([0-9])?(\/[A-G][#b]?)?$/;

      let contagemCifras = 0;
      for (const p of palavras) {
        if (padraoCifra.test(p)) {
          contagemCifras++;
        }
      }
      return (contagemCifras / palavras.length) >= 0.5;
    }

    function destacarAcordesNaLinha(linha) {
      const padraoCifra = /\b[A-G](?:[#b])?(?:m|maj|min|dim|aug|sus[24]?)?(?:[0-9])?(?:\/[A-G][#b]?)?\b/g;
      const linhaEscapada = escaparHTML(linha);
      return linhaEscapada.replace(padraoCifra, (match) => {
        return `<span class="chord">${match}</span>`;
      });
    }

    function alterarTamanhoFonte(delta) {
      tamanhoFontePercent = Math.max(70, Math.min(200, tamanhoFontePercent + delta));
      aplicarTamanhoFonte();
    }

    function resetarTamanhoFonte() {
      tamanhoFontePercent = 100;
      aplicarTamanhoFonte();
    }

    function aplicarTamanhoFonte() {
      const lyricContent = document.getElementById('lyricContent');
      const fontSizeLabel = document.getElementById('fontSizeLabel');
      if (lyricContent) {
        lyricContent.style.fontSize = `calc(1.05rem * ${tamanhoFontePercent / 100})`;
      }
      if (fontSizeLabel) {
        fontSizeLabel.textContent = `${tamanhoFontePercent}%`;
      }
    }

    function alternarExibicaoCifras() {
      exibirCifras = !exibirCifras;
      if (hinoAtualId !== null) {
        exibirHino(hinoAtualId);
      }
    }

    function alternarAutoScroll() {
      autoscrollAtivo = !autoscrollAtivo;
      const btn = document.getElementById('btnAutoScroll');

      if (autoscrollAtivo) {
        btn.classList.add('active');
        btn.textContent = 'Rolagem: ON';
        iniciarAutoScroll();
      } else {
        btn.classList.remove('active');
        btn.textContent = 'Auto-scroll';
        pararAutoScroll();
      }
    }

    function mudarVelocidadeAutoScroll(val) {
      autoscrollVelocidade = parseFloat(val) || 1;
      if (autoscrollAtivo) {
        pararAutoScroll();
        iniciarAutoScroll();
      }
    }

    function iniciarAutoScroll() {
      pararAutoScroll();
      const intervaloMs = Math.max(10, 35 / autoscrollVelocidade);
      autoscrollTimer = setInterval(() => {
        window.scrollBy({ top: 1, behavior: 'smooth' });
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
          alternarAutoScroll();
        }
      }, intervaloMs);
    }

    function pararAutoScroll() {
      if (autoscrollTimer) {
        clearInterval(autoscrollTimer);
        autoscrollTimer = null;
      }
    }

    function alternarModoProjetor() {
      document.body.classList.toggle('projector-mode');
    }

    async function copiarLetra() {
      const hino = hinosData.find(h => h.id === hinoAtualId);
      if (!hino) return;

      try {
        await navigator.clipboard.writeText(`${hino.titulo}\n\n${hino.letra}`);
        alert('Letra copiada com sucesso!');
      } catch (err) {
        console.error('Erro ao copiar:', err);
      }
    }

    function alternarOrdenacao() {
      ordemAlfabetica = !ordemAlfabetica;
      document.getElementById('sortBtn').textContent = ordemAlfabetica ? 'Ordem: A-Z' : 'Ordem: Nº';
      renderizarLista();
    }

    function filtrarHinos() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('searchClearBtn');
      clearBtn.classList.toggle('active', val.trim().length > 0);
      renderizarLista();
    }

    function limparBusca() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('searchClearBtn').classList.remove('active');
      renderizarLista();
      input.focus();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function escaparHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', carregarHinos);
  </script>
</body>
</html>
