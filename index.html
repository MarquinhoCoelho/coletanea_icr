<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletânea de Louvores - ICR Florianópolis</title>
  <link rel="icon" type="image/png" href="icr_logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f6856">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace']
          },
          colors: {
            icr: {
              DEFAULT: '#0f6856',
              dark: '#0a4d3f',
              light: '#f0f7f5',
              border: '#c3e2db'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden w-full">

  <button class="projector-exit-btn" onclick="alternarModoProjetor()">Sair do Modo Projetor</button>

  <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden" onclick="closeSidebarMobile()"></div>

  <header class="h-14 bg-white border-b border-slate-200/80 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30 shrink-0 shadow-xs">
    <div class="flex items-center gap-3">
      <button class="p-2 text-slate-600 hover:text-icr hover:bg-slate-100 rounded-lg transition-all border-0 bg-transparent focus:outline-none" id="toggleSidebarBtn" onclick="toggleSidebar()" aria-label="Menu">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
        </svg>
      </button>
      <a href="#" class="flex items-center gap-3 text-decoration-none" onclick="location.reload(); return false;">
        <img 
          src="icr_logo_sem_fundo.png" 
          onerror="this.onerror=null; this.src='icr_logo_maior.png';" 
          alt="Logo ICR Florianópolis" 
          class="h-8 sm:h-9 w-auto object-contain"
        >
        <div class="flex flex-col">
          <span class="text-sm font-extrabold text-icr leading-tight tracking-tight">Coletânea de Louvores</span>
          <span class="text-[10px] font-semibold text-slate-500 hidden sm:inline">ICR Florianópolis</span>
        </div>
      </a>
    </div>

    <div class="flex items-center gap-2">
      <button 
        id="btnInstalarPWA" 
        onclick="instalarAppPWA()" 
        class="px-3 py-1.5 text-xs font-bold text-icr bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 rounded-lg transition-all shadow-2xs flex items-center gap-1.5"
      >
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
        </svg>
        <span class="hidden sm:inline">Instalar Aplicativo</span>
        <span class="sm:hidden">Instalar</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 relative w-full items-stretch min-h-[calc(100vh-56px)]">

    <aside class="fixed top-[56px] bottom-0 left-0 z-50 w-72 bg-slate-50 border-r border-slate-200/80 flex flex-col -translate-x-full transition-transform duration-200 shadow-xl md:sticky md:top-[56px] md:h-[calc(100vh-56px)] md:translate-x-0 md:w-80 md:shadow-none md:z-auto shrink-0" id="sidebar">
      <div class="p-3.5 border-b border-slate-200/80 flex flex-col gap-2.5 bg-slate-50 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500">Repertório</span>
          <button class="px-2.5 py-1 text-[11px] font-bold text-slate-600 bg-white border border-slate-200 rounded-md hover:text-icr hover:border-icr-border transition-colors shadow-xs" id="sortBtn" onclick="alternarOrdenacao()">
            Ordem: Nº
          </button>
        </div>

        <div class="relative w-full">
          <input 
            type="text" 
            id="searchInput" 
            class="w-full h-9 px-3 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:border-icr focus:ring-2 focus:ring-icr/10 transition-all" 
            placeholder="Buscar por número ou título..." 
            oninput="filtrarHinos()" 
            autocomplete="off"
          >
          <button class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm hidden" id="searchClearBtn" onclick="limparBusca()">&times;</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar p-2">
        <ul class="space-y-0.5" id="listaHinos"></ul>
        <div id="noResults" class="p-6 text-center text-xs text-slate-500 hidden">
          Nenhum hino encontrado.
        </div>
      </div>
    </aside>

    <main class="flex-1 p-4 sm:p-6 w-full min-w-0">
      <div id="conteudoHino">
        <div class="flex flex-col items-center justify-center min-h-[360px] text-center p-8 border border-slate-200/80 bg-white rounded-2xl shadow-sm w-full">
          <h2 class="text-lg font-bold text-slate-800 mb-1.5">Coletânea ICR Florianópolis</h2>
          <p class="text-xs text-slate-500 max-w-md leading-relaxed">Selecione um louvor no menu lateral para visualizar a letra completa.</p>
        </div>
      </div>
    </main>

  </div>

  <script>
    let hinosData = [];
    let hinoAtualId = null;
    let ordemAlfabetica = false;
    let exibirCifras = false;
    let tamanhoFonte = 100;
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstalarPWA');
      if (btn) btn.classList.remove('hidden');
    });

    async function instalarAppPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('PWA aceito pelo usuário');
        }
        deferredPrompt = null;
        const btn = document.getElementById('btnInstalarPWA');
        if (btn) btn.classList.add('hidden');
      } else {
        alert('Para instalar no seu celular:\n\nNo iPhone / iPad (Safari):\n1. Toque no botão Compartilhar (quadrado com seta pra cima).\n2. Escolha "Adicionar à Tela de Início".\n\nNo Android (Chrome):\n1. Toque nos 3 pontinhos no topo superior direito.\n2. Escolha "Instalar aplicativo" ou "Adicionar à tela inicial".');
      }
    }

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('btnInstalarPWA');
        if (btn) btn.classList.add('hidden');
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('ServiceWorker error:', err);
        });
      });
    }

    async function carregarHinos() {
      try {
        const res = await fetch('/api/hinos');
        if (!res.ok) throw new Error('Erro ao carregar hinos');
        hinosData = await res.json();
        renderizarLista();

        if (hinosData.length > 0) {
          const hashId = parseInt(window.location.hash.replace('#', ''));
          const itemInicial = hinosData.find(h => h.id === hashId) || hinosData[0];
          exibirHino(itemInicial.id);
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    function renderizarLista() {
      const termo = document.getElementById('searchInput').value.trim().toLowerCase();
      const listaEl = document.getElementById('listaHinos');
      const noResultsEl = document.getElementById('noResults');

      let filtrados = hinosData.filter(hino => {
        const numStr = String(hino.id);
        const numPad = String(hino.id).padStart(2, '0');
        const tituloLower = hino.titulo.toLowerCase();
        return tituloLower.includes(termo) || numStr === termo || numPad === termo;
      });

      if (ordemAlfabetica) {
        filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
      } else {
        filtrados.sort((a, b) => a.id - b.id);
      }

      listaEl.innerHTML = '';

      if (filtrados.length === 0) {
        noResultsEl.classList.remove('hidden');
        return;
      } else {
        noResultsEl.classList.add('hidden');
      }

      filtrados.forEach(hino => {
        const numFormatado = String(hino.id).padStart(2, '0');
        const isSelected = hino.id === hinoAtualId;

        const li = document.createElement('li');
        li.innerHTML = `
          <a href="#${hino.id}" onclick="selecionarHino(${hino.id}); return false;" 
             class="flex items-center gap-3 px-3 py-2.5 text-xs font-semibold rounded-lg transition-all ${isSelected ? 'bg-emerald-50 text-icr font-extrabold shadow-2xs' : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900'}">
            <span class="font-mono text-[11px] text-slate-400 min-w-[20px]">${numFormatado}</span>
            <span class="flex-1 truncate">${escaparHTML(hino.titulo)}</span>
          </a>
        `;
        listaEl.appendChild(li);
      });
    }

    function selecionarHino(id) {
      hinoAtualId = id;
      window.location.hash = id;
      renderizarLista();
      exibirHino(id);
      closeSidebarMobile();
    }

    function exibirHino(id) {
      const hino = hinosData.find(h => h.id === id);
      if (!hino) return;

      hinoAtualId = id;
      const numFormatado = String(hino.id).padStart(2, '0');

      let textoExibicao = hino.letra;
      if (!exibirCifras) {
        textoExibicao = filtrarSomenteLetras(hino.letra);
      }

      const container = document.getElementById('conteudoHino');
      container.innerHTML = `
        <article class="bg-white border border-slate-200/80 rounded-2xl p-6 sm:p-8 shadow-sm w-full">
          <header class="mb-6">
            <div class="flex items-center gap-2 mb-2">
              <span class="font-mono text-xs font-bold text-icr bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-full">#${numFormatado}</span>
              ${hino.tom ? `<span class="text-xs font-bold text-slate-700 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-md">Tom: ${escaparHTML(hino.tom)}</span>` : ''}
            </div>

            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">${escaparHTML(hino.titulo)}</h1>

            <div class="border-b border-slate-100 my-4"></div>

            <div class="flex items-center justify-between gap-3 flex-wrap bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
              <div>
                <button onclick="alternarCifras()" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${exibirCifras ? 'bg-icr text-white shadow-xs' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}">
                  Cifras: ${exibirCifras ? 'ON' : 'OFF'}
                </button>
              </div>

              <div class="flex items-center gap-1.5 bg-white border border-slate-200 p-1 rounded-lg">
                <button onclick="alterarTamanhoFonte(-10)" class="px-2.5 py-1 text-xs font-bold text-slate-700 hover:bg-slate-100 rounded transition-colors" title="Diminuir fonte">A-</button>
                <span class="font-mono text-xs font-bold text-slate-600 px-1.5" id="fontSizeLabel">${tamanhoFonte}%</span>
                <button onclick="alterarTamanhoFonte(10)" class="px-2.5 py-1 text-xs font-bold text-slate-700 hover:bg-slate-100 rounded transition-colors" title="Aumentar fonte">A+</button>
                <button onclick="resetarTamanhoFonte()" class="px-2.5 py-1 text-[11px] font-bold text-slate-500 hover:bg-slate-100 rounded transition-colors border-l border-slate-200">Reset</button>
              </div>
            </div>
          </header>

          <div class="w-full">
            <pre class="lyric-content" id="lyricContent" style="font-size: ${tamanhoFonte / 100 * 1.05}rem;">${escaparHTML(textoExibicao)}</pre>
          </div>
        </article>
      `;

      renderizarLista();
    }

    function alternarCifras() {
      exibirCifras = !exibirCifras;
      if (hinoAtualId !== null) {
        exibirHino(hinoAtualId);
      }
    }

    function alterarTamanhoFonte(delta) {
      tamanhoFonte = Math.min(Math.max(tamanhoFonte + delta, 60), 200);
      const el = document.getElementById('lyricContent');
      if (el) {
        el.style.fontSize = `${tamanhoFonte / 100 * 1.05}rem`;
      }
      const label = document.getElementById('fontSizeLabel');
      if (label) {
        label.textContent = `${tamanhoFonte}%`;
      }
    }

    function resetarTamanhoFonte() {
      tamanhoFonte = 100;
      alterarTamanhoFonte(0);
    }

    function ehLinhaDeCifra(linha) {
      if (!linha || !linha.trim()) return false;
      const tokens = linha.trim().split(/\s+/);
      const regexCifra = /^[A-G](b|#)?(m|maj|min|dim|aug|add|sus|M)?\d*(?:\/[A-G](b|#)?)?$/;
      let count = 0;
      for (const token of tokens) {
        if (regexCifra.test(token)) count++;
      }
      return (count / tokens.length) > 0.5;
    }

    function filtrarSomenteLetras(texto) {
      if (!texto) return '';
      const linhas = texto.split('\n');
      return linhas.filter(l => !ehLinhaDeCifra(l)).join('\n');
    }

    function alternarModoProjetor() {
      document.body.classList.toggle('projector-mode');
    }

    function alternarOrdenacao() {
      ordemAlfabetica = !ordemAlfabetica;
      document.getElementById('sortBtn').textContent = ordemAlfabetica ? 'Ordem: A-Z' : 'Ordem: Nº';
      renderizarLista();
    }

    function filtrarHinos() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('searchClearBtn');
      if (val.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderizarLista();
    }

    function limparBusca() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('searchClearBtn').classList.add('hidden');
      renderizarLista();
      input.focus();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth < 768) {
        const isClosed = sidebar.classList.contains('-translate-x-full');
        if (isClosed) {
          sidebar.classList.remove('-translate-x-full');
          sidebar.classList.add('translate-x-0');
          overlay.classList.remove('hidden');
        } else {
          sidebar.classList.add('-translate-x-full');
          sidebar.classList.remove('translate-x-0');
          overlay.classList.add('hidden');
        }
      } else {
        sidebar.classList.toggle('md:hidden');
      }
    }

    function closeSidebarMobile() {
      if (window.innerWidth < 768) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        overlay.classList.add('hidden');
      }
    }

    function escaparHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', carregarHinos);
  </script>
</body>
</html>
