<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletânea de Louvores - ICR Florianópolis</title>
  <link rel="icon" type="image/png" href="icr_logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            icr: {
              DEFAULT: '#0f6856',
              dark: '#0a4d3f',
              light: '#f0f7f5',
              border: '#c3e2db'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col antialiased">

  <button class="projector-exit-btn" onclick="alternarModoProjetor()">Sair do Modo Projetor</button>

  <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <button class="px-3 py-1 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-none transition-colors" id="toggleSidebarBtn" onclick="toggleSidebar()">
        Menu
      </button>
      <a href="#" class="flex items-center gap-3 text-decoration-none" onclick="location.reload(); return false;">
        <img 
          src="icr_logo_sem_fundo.png" 
          onerror="this.onerror=null; this.src='icr_logo_maior.png';" 
          alt="Logo ICR Florianópolis" 
          class="h-9 w-auto object-contain"
        >
        <div class="flex flex-col">
          <span class="text-sm font-extrabold text-icr leading-tight tracking-tight">Coletânea de Louvores</span>
          <span class="text-[10px] font-semibold text-slate-500 hidden sm:inline">ICR Florianópolis</span>
        </div>
      </a>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-icr bg-icr-light border border-icr-border px-2.5 py-1 rounded-none" id="totalCounter">0 hinos</span>
    </div>
  </header>

  <div class="flex flex-1 min-h-[calc(100vh-56px)]">

    <aside class="w-72 sm:w-80 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 transition-all duration-200" id="sidebar">
      <div class="p-3 border-b border-slate-200 flex flex-col gap-2.5 bg-slate-50">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500">Repertório</span>
          <button class="px-2 py-0.5 text-[11px] font-bold text-slate-600 bg-white border border-slate-300 rounded-none hover:text-icr hover:border-icr-border transition-colors" id="sortBtn" onclick="alternarOrdenacao()">
            Ordem: Nº
          </button>
        </div>

        <div class="relative w-full">
          <input 
            type="text" 
            id="searchInput" 
            class="w-full h-8 px-2.5 text-xs bg-white border border-slate-300 rounded-none outline-none focus:border-icr focus:ring-1 focus:ring-icr focus:scale-[1.02] transition-all duration-150" 
            placeholder="Buscar por número ou título..." 
            oninput="filtrarHinos()" 
            autocomplete="off"
          >
          <button class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm hidden" id="searchClearBtn" onclick="limparBusca()">&times;</button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto">
        <ul class="divide-y divide-slate-100" id="listaHinos"></ul>
        <div id="noResults" class="p-6 text-center text-xs text-slate-500 hidden">
          Nenhum hino encontrado.
        </div>
      </div>
    </aside>

    <main class="flex-1 p-4 sm:p-8 max-w-4xl mx-auto w-full">
      <div id="conteudoHino">
        <div class="flex flex-col items-center justify-center min-h-[360px] text-center p-8 border border-slate-200 bg-slate-50 rounded-none">
          <h2 class="text-lg font-bold text-slate-800 mb-1">Coletânea ICR Florianópolis</h2>
          <p class="text-xs text-slate-600 max-w-md">Selecione um louvor na lista ao lado ou busque por número ou título para visualizar a letra e cifras.</p>
        </div>
      </div>
    </main>

  </div>

  <script>
    let hinosData = [];
    let hinoAtualId = null;
    let ordemAlfabetica = false;
    let exibirCifras = true;
    let tamanhoFontePercent = 100;
    let autoscrollAtivo = false;
    let autoscrollTimer = null;
    let autoscrollVelocidade = 1;

    async function carregarHinos() {
      try {
        const res = await fetch('/api/hinos');
        if (!res.ok) throw new Error('Erro ao carregar hinos');
        hinosData = await res.json();
        
        atualizarContador();
        renderizarLista();

        if (hinosData.length > 0) {
          const hashId = parseInt(window.location.hash.replace('#', ''));
          const itemInicial = hinosData.find(h => h.id === hashId) || hinosData[0];
          exibirHino(itemInicial.id);
        }
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    function atualizarContador() {
      const el = document.getElementById('totalCounter');
      el.textContent = `${hinosData.length} ${hinosData.length === 1 ? 'louvor' : 'louvores'}`;
    }

    function renderizarLista() {
      const termo = document.getElementById('searchInput').value.trim().toLowerCase();
      const listaEl = document.getElementById('listaHinos');
      const noResultsEl = document.getElementById('noResults');

      let filtrados = hinosData.filter(hino => {
        const numStr = String(hino.id);
        const numPad = String(hino.id).padStart(2, '0');
        const tituloLower = hino.titulo.toLowerCase();
        return tituloLower.includes(termo) || numStr === termo || numPad === termo;
      });

      if (ordemAlfabetica) {
        filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
      } else {
        filtrados.sort((a, b) => a.id - b.id);
      }

      listaEl.innerHTML = '';

      if (filtrados.length === 0) {
        noResultsEl.classList.remove('hidden');
        return;
      } else {
        noResultsEl.classList.add('hidden');
      }

      filtrados.forEach(hino => {
        const numFormatado = String(hino.id).padStart(2, '0');
        const isSelected = hino.id === hinoAtualId;

        const li = document.createElement('li');
        li.innerHTML = `
          <a href="#${hino.id}" onclick="selecionarHino(${hino.id}); return false;" 
             class="flex items-center gap-2.5 px-3 py-2.5 text-xs font-semibold text-slate-800 hover:bg-slate-100 hover:text-icr border-l-4 transition-all ${isSelected ? 'bg-icr-light text-icr font-bold border-icr' : 'border-transparent'}">
            <span class="font-mono text-[11px] text-slate-500 min-w-[20px]">${numFormatado}</span>
            <span class="flex-1 truncate">${escaparHTML(hino.titulo)}</span>
            ${hino.observacao ? `<span class="text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5">Ensaiar</span>` : ''}
          </a>
        `;
        listaEl.appendChild(li);
      });
    }

    function selecionarHino(id) {
      hinoAtualId = id;
      window.location.hash = id;
      renderizarLista();
      exibirHino(id);

      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
      }
    }

    function exibirHino(id) {
      const hino = hinosData.find(h => h.id === id);
      if (!hino) return;

      hinoAtualId = id;
      const numFormatado = String(hino.id).padStart(2, '0');

      const container = document.getElementById('conteudoHino');
      container.innerHTML = `
        <article class="bg-white">
          <header class="mb-4 pb-3 border-b-2 border-icr">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="font-mono text-xs font-bold text-icr bg-icr-light border border-icr-border px-1.5 py-0.5">#${numFormatado}</span>
              ${hino.tom ? `<span class="text-xs font-bold text-slate-700 bg-slate-100 border border-slate-300 px-2 py-0.5">Tom: ${escaparHTML(hino.tom)}</span>` : ''}
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">${escaparHTML(hino.titulo)}</h1>
            ${hino.observacao ? `
              <div class="inline-block bg-amber-50 text-amber-800 border border-amber-200 px-2.5 py-1 text-xs font-semibold">
                Observação: ${escaparHTML(hino.observacao)}
              </div>
            ` : ''}
          </header>

          <div class="flex flex-wrap items-center gap-2 py-2 px-3 bg-slate-50 border border-slate-200 mb-6 text-xs font-bold text-slate-700">
            <div class="flex items-center gap-1">
              <button class="px-2 py-1 bg-white border border-slate-300 hover:border-icr hover:text-icr transition-colors" onclick="alterarTamanhoFonte(-10)">A-</button>
              <span class="font-mono px-1 min-w-[36px] text-center" id="fontSizeLabel">${tamanhoFontePercent}%</span>
              <button class="px-2 py-1 bg-white border border-slate-300 hover:border-icr hover:text-icr transition-colors" onclick="alterarTamanhoFonte(10)">A+</button>
              <button class="px-2 py-1 bg-white border border-slate-300 hover:border-icr hover:text-icr transition-colors" onclick="resetarTamanhoFonte()">Reset</button>
            </div>

            <span class="text-slate-300">|</span>

            <button class="px-2.5 py-1 ${exibirCifras ? 'bg-icr text-white border-icr' : 'bg-white text-slate-700 border-slate-300'} border hover:opacity-90 transition-all" onclick="alternarExibicaoCifras()">
              ${exibirCifras ? 'Cifras: ON' : 'Somente Letra'}
            </button>

            <span class="text-slate-300">|</span>

            <div class="flex items-center gap-1">
              <button class="px-2.5 py-1 ${autoscrollAtivo ? 'bg-icr text-white border-icr' : 'bg-white text-slate-700 border-slate-300'} border hover:opacity-90 transition-all" onclick="alternarAutoScroll()">
                ${autoscrollAtivo ? 'Rolagem: ON' : 'Auto-scroll'}
              </button>
              <select class="h-6 px-1 bg-white border border-slate-300 text-xs font-bold outline-none" onchange="mudarVelocidadeAutoScroll(this.value)">
                <option value="1" ${autoscrollVelocidade == 1 ? 'selected' : ''}>1x</option>
                <option value="1.5" ${autoscrollVelocidade == 1.5 ? 'selected' : ''}>1.5x</option>
                <option value="2" ${autoscrollVelocidade == 2 ? 'selected' : ''}>2x</option>
              </select>
            </div>

            <span class="text-slate-300">|</span>

            <button class="px-2.5 py-1 bg-white border border-slate-300 hover:border-icr hover:text-icr transition-colors" onclick="alternarModoProjetor()">
              Modo Projetor
            </button>
            <button class="px-2.5 py-1 bg-white border border-slate-300 hover:border-icr hover:text-icr transition-colors" onclick="copiarLetra()">
              Copiar
            </button>
          </div>

          <div class="py-2">
            <pre class="lyric-content" id="lyricContent">${formatarLetraECifra(hino.letra)}</pre>
          </div>
        </article>
      `;

      aplicarTamanhoFonte();
      renderizarLista();
    }

    function formatarLetraECifra(texto) {
      if (!texto) return '';

      const linhas = texto.split('\n');
      let resultadoHtml = [];

      for (let i = 0; i < linhas.length; i++) {
        let linha = linhas[i];

        if (linha.startsWith('[Tom:')) {
          continue;
        }

        if (/^\s*\[.+\]\s*$/.test(linha)) {
          const nomeSecao = linha.replace(/\[|\]/g, '').trim();
          resultadoHtml.push(`<span class="song-section-header">${escaparHTML(nomeSecao)}</span>`);
          continue;
        }

        if (!exibirCifras) {
          if (ehLinhaDeCifra(linha)) {
            continue;
          }
        }

        if (ehLinhaDeCifra(linha)) {
          const linhaNormalizada = linha.replace(/\s{5,}/g, '    ');
          resultadoHtml.push(`<span class="chord-line">${destacarAcordesNaLinha(linhaNormalizada)}</span>`);
        } else {
          resultadoHtml.push(escaparHTML(linha));
        }
      }

      return resultadoHtml.join('\n');
    }

    function ehLinhaDeCifra(linha) {
      if (!linha || linha.trim().length === 0) return false;
      const palavras = linha.trim().split(/\s+/);
      const padraoCifra = /^[A-G]([#b])?(m|maj|min|dim|aug|sus[24]?)?([0-9])?(\/[A-G][#b]?)?$/;

      let contagemCifras = 0;
      for (const p of palavras) {
        if (padraoCifra.test(p)) {
          contagemCifras++;
        }
      }
      return (contagemCifras / palavras.length) >= 0.5;
    }

    function destacarAcordesNaLinha(linha) {
      const padraoCifra = /\b[A-G](?:[#b])?(?:m|maj|min|dim|aug|sus[24]?)?(?:[0-9])?(?:\/[A-G][#b]?)?\b/g;
      const linhaEscapada = escaparHTML(linha);
      return linhaEscapada.replace(padraoCifra, (match) => {
        return `<span class="chord">${match}</span>`;
      });
    }

    function alterarTamanhoFonte(delta) {
      tamanhoFontePercent = Math.max(70, Math.min(200, tamanhoFontePercent + delta));
      aplicarTamanhoFonte();
    }

    function resetarTamanhoFonte() {
      tamanhoFontePercent = 100;
      aplicarTamanhoFonte();
    }

    function aplicarTamanhoFonte() {
      const lyricContent = document.getElementById('lyricContent');
      const fontSizeLabel = document.getElementById('fontSizeLabel');
      if (lyricContent) {
        lyricContent.style.setProperty('--lyric-font-size', `calc(1.05rem * ${tamanhoFontePercent / 100})`);
      }
      if (fontSizeLabel) {
        fontSizeLabel.textContent = `${tamanhoFontePercent}%`;
      }
    }

    function alternarExibicaoCifras() {
      exibirCifras = !exibirCifras;
      if (hinoAtualId !== null) {
        exibirHino(hinoAtualId);
      }
    }

    function alternarAutoScroll() {
      autoscrollAtivo = !autoscrollAtivo;
      if (hinoAtualId !== null) {
        exibirHino(hinoAtualId);
      }
      if (autoscrollAtivo) {
        iniciarAutoScroll();
      } else {
        pararAutoScroll();
      }
    }

    function mudarVelocidadeAutoScroll(val) {
      autoscrollVelocidade = parseFloat(val) || 1;
      if (autoscrollAtivo) {
        pararAutoScroll();
        iniciarAutoScroll();
      }
    }

    function iniciarAutoScroll() {
      pararAutoScroll();
      const intervaloMs = Math.max(10, 35 / autoscrollVelocidade);
      autoscrollTimer = setInterval(() => {
        window.scrollBy({ top: 1, behavior: 'smooth' });
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
          autoscrollAtivo = false;
          pararAutoScroll();
          if (hinoAtualId !== null) exibirHino(hinoAtualId);
        }
      }, intervaloMs);
    }

    function pararAutoScroll() {
      if (autoscrollTimer) {
        clearInterval(autoscrollTimer);
        autoscrollTimer = null;
      }
    }

    function alternarModoProjetor() {
      document.body.classList.toggle('projector-mode');
    }

    async function copiarLetra() {
      const hino = hinosData.find(h => h.id === hinoAtualId);
      if (!hino) return;

      try {
        await navigator.clipboard.writeText(`${hino.titulo}\n\n${hino.letra}`);
        alert('Letra copiada com sucesso!');
      } catch (err) {
        console.error('Erro ao copiar:', err);
      }
    }

    function alternarOrdenacao() {
      ordemAlfabetica = !ordemAlfabetica;
      document.getElementById('sortBtn').textContent = ordemAlfabetica ? 'Ordem: A-Z' : 'Ordem: Nº';
      renderizarLista();
    }

    function filtrarHinos() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('searchClearBtn');
      if (val.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderizarLista();
    }

    function limparBusca() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('searchClearBtn').classList.add('hidden');
      renderizarLista();
      input.focus();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('-translate-x-full');
      } else {
        sidebar.classList.toggle('hidden');
      }
    }

    function escaparHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', carregarHinos);
  </script>
</body>
</html>
